<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuvaranjan — Contact</title>
  <meta name="description" content="Get in touch with Yuvaranjan.">

  <link href="style.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="contactpage">

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="scroll-progress" id="scroll-progress"></div>
  <button class="scrollToTop-btn" aria-label="Back to top">↑</button>

  <!-- HEADER -->
  <header class="site-header">
    <div class="site-header__inner wrap">
      <a class="brand" href="index.html" aria-label="Yuvaranjan — home">
        <img src="images/logo.png" alt="">
        <span class="brand__mark">UV / Portfolio</span>
      </a>
      <nav class="navigation" id="primary-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Index</a></li>
          <li><a href="games/gamemenu.html">Work</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
      <button class="menu-btn" id="menu-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav"></button>
    </div>
  </header>

  <main id="main">
    <section class="section" style="border-top:none">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="section-head__index">→</span>
          <h1 class="section-head__title">Let's talk</h1>
        </div>

        <div class="contact__grid">
          <!-- FORM -->
          <form class="reveal reveal--left" action="mailto:Iamyuvaranjan@gmail.com" method="post" enctype="text/plain">
            <div class="field-row">
              <div class="field">
                <label for="firstname">First name</label>
                <input type="text" id="firstname" name="firstname" autocomplete="given-name">
              </div>
              <div class="field">
                <label for="lastname">Last name</label>
                <input type="text" id="lastname" name="lastname" autocomplete="family-name">
              </div>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" autocomplete="email">
            </div>
            <div class="field">
              <label for="additionalinfo">Message</label>
              <textarea id="additionalinfo" name="message" rows="5"></textarea>
            </div>
            <button type="submit" class="btn btn--primary">Send message</button>
          </form>

          <!-- INFO -->
          <div class="contact__info reveal reveal--right" data-delay="1">
            <dl>
              <div class="info">
                <dt>Address</dt>
                <dd>SKCET, BK Pudur, Kuniyamuthur,<br>Coimbatore, Tamil Nadu 641008</dd>
              </div>
              <div class="info">
                <dt>Email</dt>
                <dd><a href="mailto:Iamyuvaranjan@gmail.com">Iamyuvaranjan@gmail.com</a></dd>
              </div>
              <div class="info">
                <dt>Phone</dt>
                <dd><a href="tel:+919080368704">+91 90803 68704</a></dd>
              </div>
            </dl>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
